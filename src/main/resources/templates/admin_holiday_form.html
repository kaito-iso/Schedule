<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Admin - Holiday Registration</title>
	<script src="https://cdn.tailwindcss.com"></script>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
	<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
	<style>
		/* ヘッダー（月・年）と曜日エリアの背景をすべて解除 */
		.flatpickr-calendar .flatpickr-month,
		.flatpickr-calendar .flatpickr-weekdays,
		.flatpickr-calendar .flatpickr-weekdaycontainer {
			background: #f8fafc !important;
		}

		/* 月のドロップダウン選択時の青い背景を解除 */
		.flatpickr-current-month .flatpickr-monthDropdown-months,
		.flatpickr-current-month .flatpickr-monthDropdown-months:hover {
			background: transparent !important;
			color: #475569 !important;
			font-weight: bold !important;
		}

		/* リスト全体の背景を白くし、青い影を消す */
		.flatpickr-monthDropdown-months {
			background: #ffffff !important;
			color: #475569 !important;
		}

		/* リスト内の各選択肢（option） */
		.flatpickr-monthDropdown-month {
			background-color: #ffffff !important;
			color: #475569 !important;
		}

		/* ドロップダウンをホバーした際、または選択した際の色 */
		.flatpickr-monthDropdown-months:focus,
		.flatpickr-monthDropdown-months:active {
			background-color: #f8fafc !important;
			outline: none !important;
		}

		/* カレンダー上部の「月」表示エリア自体の背景を透明化 */
		.flatpickr-current-month .flatpickr-monthDropdown-months {
			background: transparent !important;
		}

		/* 月・年のテキストと矢印の色を濃いグレーに */
		.flatpickr-current-month,
		.flatpickr-current-month input.cur-year,
		.flatpickr-prev-month svg,
		.flatpickr-next-month svg {
			color: #475569 !important;
			fill: #475569 !important;
		}

		/* 曜日のテキスト自体の背景と色 */
		span.flatpickr-weekday {
			background: transparent !important;
			color: #94a3b8 !important;
			font-weight: bold !important;
		}

		/* 日曜の色分け（曜日ラベル） */
		.flatpickr-weekday:nth-child(7n+1) {
			color: #ef4444 !important;
		}

		/* 土曜の色分け（曜日ラベル） */
		.flatpickr-weekday:nth-child(7n) {
			color: #3b82f6 !important;
		}

		/* カレンダー内の日付の日曜の色分け */
		.flatpickr-day:nth-child(7n+1):not(.selected) {
			color: #ef4444 !important;
		}

		/* カレンダー内の日付の土曜の色分け */
		.flatpickr-day:nth-child(7n):not(.selected) {
			color: #3b82f6 !important;
		}

		/* 選択した日のデザイン */
		.flatpickr-day.selected,
		.flatpickr-day.selected:hover {
			background: #0d9488 !important;
			border-color: #0d9488 !important;
			color: #ffffff !important;
		}

		/* 全体の枠線と角丸 */
		.flatpickr-calendar {
			border: 1px solid #e2e8f0 !important;
			border-radius: 12px !important;
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
		}

		/* カレンダー上部の三角形 */
		.flatpickr-calendar.arrowTop:before,
		.flatpickr-calendar.arrowTop:after {
			border-bottom-color: #f8fafc !important;
		}

		/* 下向きの矢印（カレンダーが上に表示された場合）も対応 */
		.flatpickr-calendar.arrowBottom:before,
		.flatpickr-calendar.arrowBottom:after {
			border-top-color: #ffffff !important;
		}
	</style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">
	<div th:replace="~{common/layout :: header}"></div>

	<main class="flex-1 max-w-2xl mx-auto w-full py-6 px-4 sm:px-6 lg:px-8">

		<div class="mb-4 flex items-center gap-2 text-sm text-gray-400">
			<a th:href="@{/menu}" class="hover:text-teal-600 transition">メニュー</a>
			<span>/</span>
			<a th:href="@{/admin/setting}" class="hover:text-teal-600 transition">システム設定</a>
			<span>/</span>
			<a th:href="@{/admin/holidays}" class="hover:text-teal-600 transition">祝日マスタ</a>
			<span>/</span>
			<span class="text-gray-900 font-medium">新規登録</span>
		</div>

		<div class="bg-white shadow-sm rounded-xl border border-gray-200 p-8 sm:p-10">

			<div class="mb-10 flex items-center gap-4">
				<span class="p-2 bg-red-50 text-red-600 rounded-lg shadow-sm">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M12 4v8m0 0v8m0-8h8m-8 0H4"></path>
					</svg>
				</span>
				<h1 class="text-2xl font-bold text-gray-900">祝日の新規登録</h1>
			</div>

			<form th:action="@{/admin/holiday/create}" th:object="${holidayForm}" method="post" class="space-y-6">

				<div class="min-h-[28px] flex items-end">
					<div th:if="${successMessage}"
						class="flex items-center gap-1.5 text-emerald-600 animate-fade-in pb-1">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7">
							</path>
						</svg>
						<span class="text-sm font-bold" th:text="${successMessage}"></span>
					</div>
				</div>

				<div>
					<label class="block text-sm font-bold text-gray-700 mb-2">日付を選択</label>
					<div class="relative group">
						<input type="text" th:field="*{holidayDate}" id="date-input" readonly
							class="w-full px-5 py-3 bg-gray-50 border rounded-xl outline-none transition-all cursor-pointer"
							th:classappend="${#fields.hasErrors('holidayDate')} ? 'border-red-400 ring-4 ring-red-50 bg-red-50' : 'border-gray-200 focus:border-teal-500 focus:ring-4 focus:ring-teal-50/50'"
							placeholder="カレンダーから選択...">
						<div
							class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-teal-500 transition-colors pointer-events-none">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
								</path>
							</svg>
						</div>
					</div>
					<p th:if="${#fields.hasErrors('holidayDate')}" th:errors="*{holidayDate}"
						class="text-red-500 text-xs mt-2 font-bold flex items-center gap-1 leading-relaxed">
						<span class="w-1 h-1 bg-red-500 rounded-full"></span>
					</p>
				</div>

				<div>
					<label class="block text-sm font-bold text-gray-700 mb-2">祝日名 / 休日名</label>
					<input type="text" th:field="*{holidayName}" placeholder="例：創立記念日"
						class="w-full px-5 py-3 bg-gray-50 border rounded-xl outline-none transition-all"
						th:classappend="${#fields.hasErrors('holidayName')} ? 'border-red-400 ring-4 ring-red-50 bg-red-50' : 'border-gray-200 focus:border-teal-500 focus:ring-4 focus:ring-teal-50/50'">
					<p th:if="${#fields.hasErrors('holidayName')}" th:errors="*{holidayName}"
						class="text-red-500 text-xs mt-2 font-bold flex items-center gap-1 leading-relaxed">
						<span class="w-1 h-1 bg-red-500 rounded-full"></span>
					</p>
				</div>

				<div class="pt-6 flex flex-col gap-4">
					<button type="submit"
						class="w-full inline-flex items-center justify-center px-6 py-3.5 border border-transparent text-sm font-bold rounded-lg shadow-sm text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition-all">
						この内容で登録を確定
					</button>

					<div class="text-center">
						<a th:href="@{/admin/holidays}"
							class="text-sm font-bold text-gray-400 hover:text-gray-600 transition-colors">
							キャンセルして戻る
						</a>
					</div>
				</div>
			</form>
		</div>

		<div class="mt-8 flex justify-between items-center opacity-50">
			<p class="text-[10px] text-gray-400 italic font-mono">System Ref: HOLIDAY_CREATE_v2.0</p>
		</div>
	</main>

	<script>
		flatpickr("#date-input", {
			locale: "ja",
			dateFormat: "Y-m-d",
			disableMobile: "true",
			animate: true
		});
	</script>
</body>

</html>
