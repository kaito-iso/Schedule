<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras-spring-security">

<head>
	<meta charset="UTF-8">
	<title>Schedule - Menu</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
	<div th:replace="~{common/layout :: header}"></div>

	<main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
		<div class="bg-white border border-gray-300 rounded shadow-sm overflow-hidden mb-8">

			<div class="flex justify-between items-center bg-white px-4 py-2 border-b border-gray-300">
				<div class="text-lg font-medium">
					<p th:text="${today}">今日の日付</p>
				</div>
				<div class="flex border border-gray-300 rounded text-sm">
					<a th:href="@{/menu(date=${prevWeek})}"
						class="px-3 py-1 border-r border-gray-300 hover:bg-gray-100">前週</a>
					<a th:href="@{/menu(date=${prevDay})}"
						class="px-3 py-1 border-r border-gray-300 hover:bg-gray-100">前日</a>
					<a th:href="@{/menu}" class="px-3 py-1 border-r border-gray-300 bg-gray-50 font-bold">今日</a>
					<a th:href="@{/menu(date=${nextDay})}"
						class="px-3 py-1 border-r border-gray-300 hover:bg-gray-100">翌日</a>
					<a th:href="@{/menu(date=${nextWeek})}" class="px-3 py-1 hover:bg-gray-100">翌週</a>
				</div>
			</div>

			<div class="grid grid-cols-8 border-collapse">
				<div class="border-r border-gray-300 p-4 flex flex-col justify-center items-center text-center">
					<div class="font-bold">山田 太郎</div>
					<div class="text-sm text-gray-500">月予定</div>
				</div>

				<div th:each="day : ${days}" class="border-r border-gray-300 flex flex-col min-h-[200px]"
					th:classappend="${day.getDayOfWeek().name() == 'SATURDAY' ? 'bg-blue-50' : (day.getDayOfWeek().name() == 'SUNDAY' ? 'bg-red-50' : '')}">

					<div class="text-center py-1 border-b border-gray-300"
						th:classappend="${day.getDayOfWeek().name() == 'SATURDAY' ? 'bg-blue-200' : (day.getDayOfWeek().name() == 'SUNDAY' ? 'bg-red-200' : 'bg-gray-50')}">
						<p th:text="${#temporals.format(day, 'dd日(E)', T(java.util.Locale).JAPANESE)}">日付</p>
					</div>

					<div class="p-2 flex-grow text-xs text-center">
					</div>

					<div class="p-1 border-t border-gray-100 text-gray-400 cursor-pointer hover:bg-opacity-50 text-center"
						th:classappend="${day.getDayOfWeek().name() == 'SATURDAY' ? 'hover:bg-blue-100' : (day.getDayOfWeek().name() == 'SUNDAY' ? 'hover:bg-red-100' : 'hover:bg-gray-50')}">
						+
					</div>
				</div>
			</div>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
			<div class="bg-white p-6 rounded shadow-sm border border-gray-200 h-64">
				<h2 class="font-bold border-b pb-2 mb-4 text-gray-700">お知らせ</h2>
				<p class="text-sm text-gray-500 italic">ここに最新のお知らせが表示されます。</p>
			</div>
			<div class="bg-white p-6 rounded shadow-sm border border-gray-200 h-64">
				<h2 class="font-bold border-b pb-2 mb-4 text-gray-700">データグラフ</h2>
				<p class="text-sm text-gray-500 italic">ここにグラフが表示されます。</p>
			</div>
		</div>
	</main>
</body>

</html>
