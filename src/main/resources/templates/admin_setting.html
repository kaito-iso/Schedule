<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras-spring-security">

<head>
	<meta charset="UTF-8">
	<title>Admin - System Settings</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

	<div th:replace="~{common/layout :: header}"></div>

	<main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">

		<div class="mb-6 flex items-center gap-2 text-sm text-gray-500">
			<a th:href="@{/menu}" class="hover:text-teal-600">メニュー</a>
			<span>/</span>
			<span class="text-gray-900 font-medium">システム設定</span>
		</div>

		<section class="mb-12">
			<h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
				<span class="w-1.5 h-6 bg-teal-500 rounded-full"></span>
				ユーザー・組織管理
			</h2>
			<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
				<a th:href="@{/admin/users}"
					class="group bg-white p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md hover:border-teal-500 transition-all">
					<div class="flex items-center gap-4">
						<div
							class="p-3 bg-teal-50 rounded-lg text-teal-600 group-hover:bg-teal-600 group-hover:text-white transition-colors">
							<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
								</path>
							</svg>
						</div>
						<div>
							<h3 class="font-bold text-gray-900 group-hover:text-teal-600 text-base">ユーザー管理マスタ</h3>
							<p class="text-xs text-gray-500 mt-1">利用者の登録・権限・ログイン管理</p>
						</div>
					</div>
				</a>

				<a th:href="@{/admin/departments}"
					class="group bg-white p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md hover:border-teal-500 transition-all">
					<div class="flex items-center gap-4">
						<div
							class="p-3 bg-blue-50 rounded-lg text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors">
							<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
								</path>
							</svg>
						</div>
						<div>
							<h3 class="font-bold text-gray-900 group-hover:text-teal-600 text-base">部署マスタ</h3>
							<p class="text-xs text-gray-500 mt-1">組織図・部署情報のメンテナンス</p>
						</div>
					</div>
				</a>

				<a th:href="@{/admin/positions}"
					class="group bg-white p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md hover:border-teal-500 transition-all">
					<div class="flex items-center gap-4">
						<div
							class="p-3 bg-indigo-50 rounded-lg text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
							<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14">
								</path>
							</svg>
						</div>
						<div>
							<h3 class="font-bold text-gray-900 group-hover:text-teal-600 text-base">役職者マスタ</h3>
							<p class="text-xs text-gray-500 mt-1">役職名・役職順位の管理</p>
						</div>
					</div>
				</a>
			</div>
		</section>

		<section class="mb-12">
			<h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
				<span class="w-1.5 h-6 bg-orange-400 rounded-full"></span>
				設備・カレンダー管理
			</h2>
			<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
				<a th:href="@{/admin/facilities}"
					class="group bg-white p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md hover:border-teal-500 transition-all">
					<div class="flex items-center gap-4">
						<div
							class="p-3 bg-orange-50 rounded-lg text-orange-600 group-hover:bg-orange-600 group-hover:text-white transition-colors">
							<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
								</path>
							</svg>
						</div>
						<div>
							<h3 class="font-bold text-gray-900 group-hover:text-teal-600 text-base">施設設備マスタ</h3>
							<p class="text-xs text-gray-500 mt-1">会議室・備品の登録</p>
						</div>
					</div>
				</a>

				<a th:href="@{/admin/holidays}"
					class="group bg-white p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md hover:border-teal-500 transition-all">
					<div class="flex items-center gap-4">
						<div
							class="p-3 bg-red-50 rounded-lg text-red-600 group-hover:bg-red-600 group-hover:text-white transition-colors">
							<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
								</path>
							</svg>
						</div>
						<div>
							<h3 class="font-bold text-gray-900 group-hover:text-teal-600 text-base">祝日マスタ</h3>
							<p class="text-xs text-gray-500 mt-1">会社の休日・カレンダー設定</p>
						</div>
					</div>
				</a>

				<div
					class="opacity-60 bg-gray-100 p-6 rounded-xl border border-dashed border-gray-300 flex items-center justify-center">
					<span class="text-gray-400 text-sm font-medium italic">+ 追加マスタ予定地</span>
				</div>
			</div>
		</section>

	</main>

</body>

</html>
