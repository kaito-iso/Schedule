<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras-spring-security">

<head>
	<meta charset="UTF-8">
	<title>Schedule - Password Change</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">
	<div th:replace="~{common/layout :: header}"></div>

	<main class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
		<div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg border border-gray-100">
			<div class="text-center mb-8">
				<h1 class="text-2xl font-bold text-gray-800 tracking-tight">パスワード変更</h1>
				<p class="text-sm text-gray-500 mt-2">安全なパスワードを設定してください</p>

				<div th:if="${successMessage}"
					class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm">
					<span th:text="${successMessage}"></span>
				</div>
				<div th:if="${errorMessage}"
					class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
					<span th:text="${errorMessage}"></span>
				</div>
			</div>

			<form th:action="@{/password/change}" method="post" th:object="${passwordChangeForm}" class="space-y-5">
				<div>
					<label class="text-sm font-medium text-gray-700 block mb-1.5">現在のパスワード</label>
					<input type="password" th:field="*{currentPassword}"
						class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none transition"
						placeholder="••••••••">
					<p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"
						class="text-red-500 text-xs mt-1 font-medium"></p>
				</div>

				<div class="flex flex-col gap-3 pt-4">
					<button type="submit"
						class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-lg transition duration-200">
						パスワードを更新する
					</button>
					<a th:href="@{/menu}"
						class="w-full text-center text-sm text-gray-500 hover:text-gray-800 py-2.5 transition">
						メニュー画面へ
					</a>
				</div>
			</form>
		</div>
	</main>
</body>

</html>
