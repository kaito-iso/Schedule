<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras-spring-security">

<head>
	<meta charset="UTF-8">
	<title>Schedule - PasswordChange</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">

	<div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg border border-gray-100">
		<div class="text-center mb-8">
			<h1 class="text-2xl font-bold text-gray-800 tracking-tight">パスワード変更</h1>
			<p class="text-sm text-gray-500 mt-2">安全なパスワードを設定してください</p>

			<div th:if="${successMessage}"
				class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm transition">
				<span th:text="${successMessage}">更新完了メッセージ</span>
			</div>

			<div th:if="${errorMessage}"
				class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm transition">
				<span th:text="${errorMessage}">システムエラーメッセージ</span>
			</div>
		</div>

		<form th:action="@{/password/change}" method="post" th:object="${passwordChangeForm}" class="space-y-5">

			<div class="relative">
				<label class="text-sm font-medium text-gray-700 block mb-1.5" for="currentPassword">現在のパスワード</label>
				<div class="relative text-gray-400 focus-within:text-teal-600">
					<span class="absolute inset-y-0 left-0 pl-4 flex items-center">
						<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
							</path>
						</svg>
					</span>
					<input type="password" th:field="*{currentPassword}" placeholder="••••••••" id="currentPassword"
						th:errorclass="'border-red-500 focus:ring-red-500'"
						class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition duration-150">
				</div>
				<p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"
					class="text-red-500 text-xs mt-1 ml-1 font-medium transition-all"></p>
			</div>

			<div class="relative">
				<label class="text-sm font-medium text-gray-700 block mb-1.5" for="password1">新しいパスワード</label>
				<div class="relative text-gray-400 focus-within:text-teal-600">
					<span class="absolute inset-y-0 left-0 pl-4 flex items-center">
						<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
							</path>
						</svg>
					</span>
					<input type="password" th:field="*{password1}" placeholder="••••••••" id="password1"
						th:errorclass="'border-red-500 focus:ring-red-500'"
						class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition duration-150">
				</div>
				<p th:if="${#fields.hasErrors('password1')}" th:errors="*{password1}"
					class="text-red-500 text-xs mt-1 ml-1 font-medium transition-all"></p>
			</div>

			<div class="relative">
				<label class="text-sm font-medium text-gray-700 block mb-1.5" for="password2">パスワード確認用</label>
				<div class="relative text-gray-400 focus-within:text-teal-600">
					<span class="absolute inset-y-0 left-0 pl-4 flex items-center">
						<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
							</path>
						</svg>
					</span>
					<input type="password" th:field="*{password2}" placeholder="••••••••" id="password2"
						th:errorclass="'border-red-500 focus:ring-red-500'"
						class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition duration-150">
				</div>
				<p th:if="${#fields.hasErrors('password2')}" th:errors="*{password2}"
					class="text-red-500 text-xs mt-1 ml-1 font-medium transition-all"></p>
			</div>

			<div class="flex flex-col gap-3 pt-4">
				<button type="submit"
					class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2">
					パスワードを更新する
				</button>
				<a th:href="@{/menu}"
					class="w-full text-center text-sm text-gray-500 hover:text-gray-800 py-2.5 transition">
					戻 る
				</a>
			</div>
		</form>
	</div>

</body>

</html>
