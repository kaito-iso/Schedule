<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${mode == 'create'} ? 'Admin - Facility Registration' : 'Admin - Facility Edit'"></title>
	<title>Admin - Facility Edit</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">
	<div th:replace="~{common/layout :: header}"></div>

	<main class="flex-1 max-w-2xl mx-auto w-full py-6 px-4 sm:px-6 lg:px-8">

		<div class="mb-4 flex items-center gap-2 text-sm text-gray-400">
			<a th:href="@{/menu}" class="hover:text-teal-600 transition">メニュー</a>
			<span>/</span>
			<a th:href="@{/admin/setting}" class="hover:text-teal-600 transition">システム設定</a>
			<span>/</span>
			<a th:href="@{/admin/facilities}" class="hover:text-teal-600 transition">施設マスタ</a>
			<span>/</span>
			<span class="text-gray-900 font-medium" th:text="${mode == 'create'} ? '新規登録' : '編集'"></span>
		</div>

		<div class="bg-white shadow-sm rounded-xl border border-gray-200 p-8 sm:p-10">

			<div class="mb-10 flex items-center gap-4">
				<span class="p-2 bg-orange-50 text-orange-600 rounded-lg shadow-sm">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
						</path>
					</svg>
				</span>
				<h1 class="text-2xl font-bold text-gray-900" th:text="${mode == 'create'} ? '施設の新規登録' : '施設の編集'"></h1>
			</div>

			<form th:action="@{/admin/facility/save}" th:object="${facilityForm}" method="post" class="space-y-6">

				<input type="hidden" name="mode" th:value="${mode}" />

				<div class="min-h-[28px] flex items-end">
					<div th:if="${successMessage}"
						class="flex items-center gap-1.5 text-emerald-600 animate-fade-in pb-1">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7">
							</path>
						</svg>
						<span class="text-sm font-bold" th:text="${successMessage}"></span>
					</div>
					<div th:if="${errorMessage}" class="flex items-center gap-1.5 text-red-500 pb-1">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0116 0z"></path>
						</svg>
						<span class="text-sm font-bold" th:text="${errorMessage}"></span>
					</div>
				</div>

				<div>
					<label class="block text-sm font-bold text-gray-700 mb-2">施設コード</label>
					<input type="text" th:field="*{facilityCode}" th:readonly="${mode == 'edit'}" placeholder="例：FAC01"
						class="w-full px-5 py-3 bg-gray-50 border rounded-xl outline-none transition-all"
						th:classappend="${#fields.hasErrors('facilityCode')} ? 'border-red-400 ring-4 ring-red-50 bg-red-50' : (${mode == 'edit'} ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'border-gray-200 focus:border-teal-500 focus:ring-4 focus:ring-teal-50/50')">
					<p th:if="${#fields.hasErrors('facilityCode')}" th:errors="*{facilityCode}"
						class="text-red-500 text-xs mt-2 font-bold flex items-center gap-1 leading-relaxed">
						<span class="w-1 h-1 bg-red-500 rounded-full"></span>
					</p>
					<p th:if="${mode == 'create'}" class="text-[10px] text-gray-400 mt-2 ml-1 italic font-medium">※
						一度登録すると変更できません（最大5文字）</p>
				</div>

				<div>
					<label class="block text-sm font-bold text-gray-700 mb-2">施設・設備名</label>
					<input type="text" th:field="*{facilityName}" placeholder="例：第1会議室"
						class="w-full px-5 py-3 bg-gray-50 border rounded-xl outline-none transition-all"
						th:classappend="${#fields.hasErrors('facilityName')} ? 'border-red-400 ring-4 ring-red-50 bg-red-50' : 'border-gray-200 focus:border-teal-500 focus:ring-4 focus:ring-teal-50/50'">
					<p th:if="${#fields.hasErrors('facilityName')}" th:errors="*{facilityName}"
						class="text-red-500 text-xs mt-2 font-bold flex items-center gap-1 leading-relaxed">
						<span class="w-1 h-1 bg-red-500 rounded-full"></span>
					</p>
				</div>

				<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
					<div>
						<label class="block text-sm font-bold text-gray-700 mb-2">表示順序</label>
						<input type="text" th:field="*{displayOrder}" placeholder="例：10"
							class="w-full px-5 py-3 bg-gray-50 border rounded-xl outline-none transition-all"
							th:classappend="${#fields.hasErrors('displayOrder')} ? 'border-red-400 ring-4 ring-red-50 bg-red-50' : 'border-gray-200 focus:border-teal-500 focus:ring-4 focus:ring-teal-50/50'">
						<p th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"
							class="text-red-500 text-xs mt-2 font-bold flex items-center gap-1 leading-relaxed">
							<span class="w-1 h-1 bg-red-500 rounded-full"></span>
						</p>
					</div>

					<div>
						<label class="block text-sm font-bold text-gray-700 mb-2">状態</label>
						<div class="flex items-center px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl h-[50px]">
							<label class="relative inline-flex items-center cursor-pointer">
								<input type="checkbox" th:field="*{active}" class="sr-only peer">
								<div
									class="w-11 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-teal-100 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-600">
								</div>
								<span
									class="ml-3 text-sm font-bold text-gray-600 peer-checked:text-teal-700 transition-colors">有効にする</span>
							</label>
						</div>
					</div>
				</div>

				<div class="pt-6 flex flex-col gap-4">
					<button type="submit"
						class="w-full inline-flex items-center justify-center px-6 py-3.5 border border-transparent text-sm font-bold rounded-lg shadow-sm text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition-all transform active:scale-[0.98]">
						<span th:text="${mode == 'create'} ? 'この内容で登録を確定' : '更新を反映する'"></span>
					</button>

					<div class="text-center">
						<a th:href="@{/admin/facilities}"
							class="text-sm font-bold text-gray-400 hover:text-gray-600 transition-colors inline-flex items-center gap-1">
							<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
							</svg>
							キャンセルして戻る
						</a>
					</div>
				</div>
			</form>
		</div>

		<div class="mt-8 flex justify-between items-center opacity-50">
			<p class="text-[10px] text-gray-400 italic font-mono">System Ref: FACILITY_FORM_v2.0</p>
		</div>
	</main>
</body>

</html>
