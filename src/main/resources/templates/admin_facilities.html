<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras-spring-security">

<head>
	<meta charset="UTF-8">
	<title>Admin - Facility Management</title>

	<script src="https://cdn.tailwindcss.com"></script>

	<style>
		.custom-scrollbar::-webkit-scrollbar {
			width: 6px;
		}

		.custom-scrollbar::-webkit-scrollbar-track {
			background: transparent;
		}

		.custom-scrollbar::-webkit-scrollbar-thumb {
			background: #cbd5e1;
			border-radius: 10px;
		}

		.custom-scrollbar::-webkit-scrollbar-thumb:hover {
			background: #94a3b8;
		}

		.sticky-header th {
			position: sticky;
			top: 0;
			z-index: 10;
			background-color: #f8fafc;
			box-shadow: 0 1px 0 0 #e5e7eb;
		}
	</style>
</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

	<div th:replace="~{common/layout :: header}"></div>

	<main class="flex-1 max-w-6xl mx-auto w-full py-6 px-4 sm:px-6 lg:px-8 flex flex-col overflow-hidden">

		<div class="flex-none">
			<div class="mb-4 flex items-center gap-2 text-sm text-gray-400">
				<a th:href="@{/menu}" class="hover:text-teal-600 transition">メニュー</a>
				<span>/</span>
				<a th:href="@{/admin/setting}" class="hover:text-teal-600 transition">システム設定</a>
				<span>/</span>
				<span class="text-gray-900 font-medium">施設マスタ</span>
			</div>

			<div th:if="${successMessage}" class="mb-4 flex items-center text-teal-600">
				<span th:text="${successMessage}" class="text-sm"></span>
			</div>

			<div th:if="${errorMessage}" class="mb-4 flex items-center text-red-500">
				<span th:text="${errorMessage}" class="text-sm"></span>
			</div>

			<div class="sm:flex sm:items-center sm:justify-between mb-6">
				<div>
					<h1 class="text-2xl font-bold text-gray-900 flex items-center gap-3">
						<span class="p-2 bg-orange-50 text-orange-600 rounded-lg shadow-sm">
							<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
								</path>
							</svg>
						</span>
						施設マスタ管理
					</h1>
				</div>

				<div class="mt-4 sm:mt-0 flex items-center gap-3">

					<a th:href="@{/admin/facility/create}"
						class="inline-flex items-center justify-center px-6 py-2.5 border border-transparent text-sm font-bold rounded-lg shadow-sm text-white bg-teal-600 hover:bg-teal-700 transition-all">
						＋ 新規施設登録
					</a>

				</div>
			</div>
		</div>

		<!-- table -->
		<div class="flex-1 bg-white shadow-sm rounded-xl border border-gray-200 overflow-hidden flex flex-col min-h-0">

			<div class="flex-1 overflow-y-auto custom-scrollbar min-h-0">

				<table class="min-w-full divide-y divide-gray-200 table-fixed">

					<thead class="sticky-header">
						<tr>
							<th class="w-[20%] px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase">
								コード
							</th>
							<th class="w-[40%] px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase">
								施設名
							</th>
							<th class="w-[20%] px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase">
								表示順
							</th>
							<th class="w-[20%] px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase">
								状態
							</th>
						</tr>
					</thead>

					<tbody class="bg-white divide-y divide-gray-100">

						<tr th:each="f : ${facilities}" class="hover:bg-teal-50/40 transition">

							<td class="px-6 py-4 text-center text-sm font-mono text-gray-900"
								th:text="${f.facilityCode}">
							</td>

							<td class="px-6 py-4 text-center text-sm text-gray-700 font-semibold"
								th:text="${f.facilityName}">
							</td>

							<td class="px-6 py-4 text-center text-sm text-gray-700" th:text="${f.displayOrder}">
							</td>

							<td class="px-6 py-4 text-center text-sm">
								<span th:text="${f.active} ? '有効' : '無効'"
									th:classappend="${f.active} ? 'text-teal-600' : 'text-red-500'">
								</span>
							</td>

						</tr>

					</tbody>
				</table>
			</div>
		</div>

		<div class="flex-none py-4 flex justify-between items-center border-t border-transparent">
			<p class="text-[10px] text-gray-400 italic">System Ref: FACILITY_MASTER_v2.0</p>
			<div class="text-right">
				<p
					class="text-xs text-gray-500 font-medium bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm inline-flex items-center">
					<span class="flex h-2 w-2 mr-2">
						<span
							class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-teal-400 opacity-75"></span>
						<span class="relative inline-flex rounded-full h-2 w-2 bg-teal-500"></span>
					</span>
					※ 施設データはシステム全体に即時反映されます。
				</p>
			</div>
		</div>

	</main>

</body>

</html>
